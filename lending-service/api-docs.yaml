openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Reservation
  description: Reservation Management API
- name: Loan
  description: Loan Management API
- name: Fine
  description: Fine Management API
paths:
  /api/reservations/{id}:
    get:
      tags:
      - Reservation
      summary: Get a reservation by its ID
      operationId: getReservationById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDto"
    put:
      tags:
      - Reservation
      summary: Update an existing reservation
      operationId: updateReservation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDto"
    delete:
      tags:
      - Reservation
      summary: Delete a reservation
      operationId: deleteReservation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/loans/{id}:
    get:
      tags:
      - Loan
      summary: Get loan by ID
      operationId: getLendById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoanDto"
    put:
      tags:
      - Loan
      summary: Update a loan
      operationId: updateLend
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoanDto"
    delete:
      tags:
      - Loan
      summary: Delete a loan
      operationId: deleteLend
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/fines/{id}:
    get:
      tags:
      - Fine
      summary: Get a fine by its ID
      operationId: getFineById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FineDto"
    put:
      tags:
      - Fine
      summary: Update an existing fine by ID
      operationId: updateFine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FineDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FineDto"
    delete:
      tags:
      - Fine
      summary: Delete a fine by ID
      operationId: deleteFine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/reservations:
    get:
      tags:
      - Reservation
      summary: Get all reservations
      operationId: getAllReservations
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationDto"
    post:
      tags:
      - Reservation
      summary: Create a new reservation
      operationId: createReservation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDto"
  /api/loans:
    get:
      tags:
      - Loan
      summary: Get all loans
      operationId: getAllLends
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanDto"
    post:
      tags:
      - Loan
      summary: Create a new loan
      operationId: createBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoanDto"
  /api/fines:
    get:
      tags:
      - Fine
      summary: Get all fines
      operationId: getAllFines
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FineDto"
    post:
      tags:
      - Fine
      summary: Create a new fine
      operationId: createFine
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FineDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FineDto"
  /api/reservations/member/{memberId}:
    get:
      tags:
      - Reservation
      summary: Get reservations by member ID
      operationId: getReservationsByMember
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationDto"
  /api/reservations/book/{bookId}:
    get:
      tags:
      - Reservation
      summary: Get reservations by book ID
      operationId: getReservationsByBook
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationDto"
  /api/loans/search:
    get:
      tags:
      - Loan
      summary: Search loans by memberId or bookCopyId
      operationId: searchLends
      parameters:
      - name: memberId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: bookCopyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanDto"
  /api/fines/member/{memberId}:
    get:
      tags:
      - Fine
      summary: Get all fines for a specific member
      operationId: getFinesByMember
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FineDto"
components:
  schemas:
    ReservationDto:
      required:
      - bookId
      - memberId
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the reservation
          format: int64
        memberId:
          type: integer
          description: Unique identifier of the member
          format: int64
        bookId:
          type: integer
          description: Unique identifier of the book
          format: int64
        reservationDate:
          type: string
          description: Date when the reservation was made
          format: date
        whenAvailableDate:
          type: string
          description: Date when the book will be available for pickup
          format: date
        status:
          type: string
          description: "Status of the reservation (e.g., ACTIVE, CANCELLED)"
      description: Reservation data transfer object
    LoanDto:
      required:
      - bookCopyId
      - id
      - memberId
      - status
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the loan
          format: int64
        memberId:
          type: integer
          description: Unique identifier of member
          format: int64
        bookCopyId:
          type: integer
          description: Unique identifier of loaned book copy
          format: int64
        loanDate:
          type: string
          description: Date when the book was loaned
          format: date
        dueDate:
          type: string
          description: Due date for returning the book
          format: date
        returnDate:
          type: string
          description: Date of actual return
          format: date
        status:
          type: string
          description: "Loan status (LOANED, RETURNED, LOST, LATE)"
      description: Loan data transfer object
    FineDto:
      required:
      - loanId
      - memberId
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the fine
          format: int64
        memberId:
          type: integer
          description: Unique identifier of member
          format: int64
        loanId:
          type: integer
          description: Unique identifier of fined loan
          format: int64
        date:
          type: string
          description: Date when the book was returned
          format: date
        amount:
          type: number
          description: Fine amount
          format: double
        status:
          type: string
          description: "Fine Status (PAID, UNPAID)"
      description: Loan data transfer object
