openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Book
  description: Book management API
paths:
  /api/books/{id}:
    get:
      tags:
      - Book
      summary: Get book by ID
      operationId: getBookById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookDto"
    put:
      tags:
      - Book
      summary: Update a book
      operationId: updateBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookDto"
    delete:
      tags:
      - Book
      summary: Delete a book
      operationId: deleteBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/books:
    get:
      tags:
      - Book
      summary: Get all books
      operationId: getAllBooks
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookDto"
    post:
      tags:
      - Book
      summary: Create a new book
      operationId: createBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookDto"
  /api/books/search:
    get:
      tags:
      - Book
      summary: "Search books by title, author and/or genre"
      operationId: searchBooks
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: author
        in: query
        required: false
        schema:
          type: string
      - name: genre
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookDto"
components:
  schemas:
    BookDto:
      type: object
      description: Book data transfer object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the book
        title:
          type: string
          description: Title of the book
          minLength: 1
        author:
          type: string
          description: Author of the book
          minLength: 1
        isbn:
          type: string
          description: ISBN of the book
          minLength: 1
        genre:
          type: string
          description: Genre of the book
          minLength: 1
        description:
          type: string
          description: Description of the book
        availableCopies:
          type: integer
          format: int32
          description: Number of available copies
          minimum: 0
        yearPublication:
          type: integer
          format: int32
          description: Year of publication
          maximum: 2100
          minimum: 1000
