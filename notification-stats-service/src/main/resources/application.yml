spring:
  application:
    name: notification-stats-service
  datasource:
    url: jdbc:h2:mem:notifstatsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.xml

  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: artemis
    password: artemis


  jms:
    pub-sub-domain: false

messaging:
  queue:
    notification-events: notification-events-queue

server:
  port: 8083