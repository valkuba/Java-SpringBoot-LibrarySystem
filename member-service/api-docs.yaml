openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082
  description: Generated server url
tags:
- name: Member
  description: Member management API
paths:
  /api/members/update/{id}:
    put:
      tags:
      - Member
      summary: Update a member
      operationId: updateMember
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDto"
  /api/members:
    get:
      tags:
      - Member
      summary: Get all members
      operationId: getAllMembers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberDto"
    post:
      tags:
      - Member
      summary: Register a new member
      operationId: registerMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMemberRegisteringDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDto"
  /api/members/activate/{id}:
    patch:
      tags:
      - Member
      summary: Activate a member
      operationId: activateMember
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/members/{id}:
    get:
      tags:
      - Member
      summary: Get member by ID
      operationId: getMemberById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDto"
  /api/members/by-username:
    get:
      tags:
      - Member
      summary: Get member by username
      operationId: getMemberByUsername
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDto"
  /api/members/by-email:
    get:
      tags:
      - Member
      summary: Get member by email
      operationId: getMemberByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDto"
  /api/members/remove/{id}:
    delete:
      tags:
      - Member
      summary: Remove a member
      operationId: removeMember
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
components:
  schemas:
    MemberDto:
      type: object
      description: Member data transfer object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the member
        username:
          type: string
          description: Username of the member
          minLength: 1
        email:
          type: string
          description: Email address of the member
          minLength: 1
        registrationDate:
          type: string
          format: date-time
          description: Date when the member registered
        activated:
          type: boolean
          description: Activation status of user account
    NewMemberRegisteringDto:
      type: object
      description: DTO for registering a new member
      properties:
        username:
          type: string
          description: Username of the new member
          minLength: 1
        email:
          type: string
          description: Email address of the new member
          minLength: 1
        password:
          type: string
          description: Password of the new member
          minLength: 1
