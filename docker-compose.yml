services:
  artemis:
    image: apache/activemq-artemis
    container_name: artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    ports:
      - "8080:8080"

  lending-service:
    build:
      context: .
      dockerfile: lending-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - artemis
    environment:
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: artemis
      SPRING_ARTEMIS_PASSWORD: artemis
      MESSAGING_QUEUE_NOTIFICATION_EVENTS: notification-events-queue

  member-service:
    build:
      context: .
      dockerfile: member-service/Dockerfile
    ports:
      - "8082:8082"

  notification-stats-service:
    build:
      context: .
      dockerfile: notification-stats-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - artemis
    environment:
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: artemis
      SPRING_ARTEMIS_PASSWORD: artemis
      MESSAGING_QUEUE_NOTIFICATION_EVENTS: notification-events-queue
      SERVICES_MEMBER_BASE_URL: http://member-service:8082
      SERVICES_BOOK_BASE_URL: http://book-service:8080

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./book-service/grafana.json:/var/lib/grafana/dashboards/grafana.json