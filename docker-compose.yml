services:
  artemis:
    image: apache/activemq-artemis:2.53.0
    container_name: artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8161 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-stats-service:
    build:
      context: .
      dockerfile: notification-stats-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    depends_on:
      artemis:
        condition: service_healthy