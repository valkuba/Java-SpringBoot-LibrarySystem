image: 'maven:3.9-eclipse-temurin-25-alpine'

cache:
  paths:
    - .m2/repository

variables:
  PROJECT_ARTIFACT_ID: pa165-library-system
  MAVEN_CLI_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

stages:
  - build
  - tests

build:
  stage: build
  tags:
    - shared-fi
  script:
    - mvn clean install $MAVEN_CLI_OPTS -DskipTests
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: always

tests:
  stage: tests
  tags:
    - shared-fi
  script:
    - mvn test $MAVEN_CLI_OPTS
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: always

